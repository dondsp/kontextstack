name: Release check

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install local Apache fixture runtime
        run: sudo apt-get update && sudo apt-get install -y apache2
      - name: Install disposable MySQL fixture runtime
        run: sudo apt-get install -y mysql-server
      - run: npm test
      - run: npm run audit:source
      - name: Inspect package contents without publishing
        run: npm pack --dry-run
